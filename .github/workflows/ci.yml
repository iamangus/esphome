name: Container Image CI

on:
  push:
    branches:
      - 'v*'

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract branch name
        id: vars
        run: echo "tag=${GITHUB_REF##refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner name
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.tag }}
            BUILD_OS=debian
          tags: ghcr.io/${{ steps.owner.outputs.name }}/esphome-thread:${{ steps.vars.outputs.tag }}
